services:
  # Master / Coordinator Node (Rank 0) + FastAPI + React Web UI di http://localhost:8000
  master-node:
    build: .
    image: mpi-matrix-lab:latest
    container_name: hpc-master-node
    hostname: master-node
    ports:
      - "8000:8000"
    volumes:
      - hpc-shared-storage:/shared_data
      - ./results:/app/results
    environment:
      - NODE_ROLE=master
      - SHARED_STORAGE_DIR=/shared_data
    networks:
      - hpc-cluster-net
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  # Worker Node 1
  worker-node-1:
    image: mpi-matrix-lab:latest
    pull_policy: never
    container_name: hpc-worker-1
    hostname: worker-1
    depends_on:
      - master-node
    volumes:
      - hpc-shared-storage:/shared_data
      - ./results:/app/results
    environment:
      - NODE_ROLE=worker
      - SHARED_STORAGE_DIR=/shared_data
    networks:
      - hpc-cluster-net
    command: tail -f /dev/null

  # Worker Node 2
  worker-node-2:
    image: mpi-matrix-lab:latest
    pull_policy: never
    container_name: hpc-worker-2
    hostname: worker-2
    depends_on:
      - master-node
    volumes:
      - hpc-shared-storage:/shared_data
      - ./results:/app/results
    environment:
      - NODE_ROLE=worker
      - SHARED_STORAGE_DIR=/shared_data
    networks:
      - hpc-cluster-net
    command: tail -f /dev/null

volumes:
  # Shared / Distributed Storage (Bagian B.4 Lembar Soal UAS)
  hpc-shared-storage:
    name: hpc-cluster-shared-volume

networks:
  hpc-cluster-net:
    driver: bridge
